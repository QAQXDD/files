<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>纸上科学 · 安提基特拉机械 · 运转版（竖屏 9:16）</title>
<style>
  :root{--ink:#2a2622;--accent:#b5402f;--glass:rgba(250,248,243,.78);--pageBg:#0f0e0d}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--pageBg);font-family:"PingFang SC","Songti SC","Noto Serif SC","Noto Serif CJK SC",Georgia,serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body.dark{--glass:rgba(38,34,30,.82);--ink:#efe6d6}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#cdc6b9}
  canvas#c{display:block;width:100%;height:100%;touch-action:none}
  .copy{position:fixed;left:10px;bottom:8px;font-size:11px;opacity:.4;color:#d8cfc0;font-style:italic;letter-spacing:.04em;transition:opacity .4s}
  .copy.hide{opacity:0}
  .bar{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 4px;padding:6px 10px;border-radius:22px;max-width:min(98vw,940px);
    background:var(--glass);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.35);transition:opacity .4s;z-index:5;font-size:14px;color:var(--ink)}
  /* 播放时控制条 2.5 秒不动就淡出，碰一下屏幕 / 动一下鼠标就回来 */
  .bar.idle{opacity:0;pointer-events:none}
  .copy.idle{opacity:0}
  .bar.hide{opacity:0;pointer-events:none}
  .bar button{white-space:nowrap;border:0;background:none;min-width:44px;height:44px;border-radius:22px;font-size:inherit;color:inherit;cursor:pointer;display:grid;place-items:center;padding:0 .7em;font-family:inherit}
  .bar button:hover{background:rgba(128,128,128,.14)}
  .bar button.on{color:var(--accent)}
  @media (max-width:820px){.bar .title,.bar .tnow{display:none}#seek{width:28vw}.bar button{min-width:40px;padding:0 .45em}.bar{gap:0 2px;padding:4px 6px}}
  .bar .title{padding:0 .6em;white-space:nowrap;letter-spacing:.03em}
  .bar .title i{color:var(--accent);font-style:normal;margin-right:.4em}
  .bar label{display:flex;align-items:center;gap:.4em;white-space:nowrap;padding:0 .4em;opacity:.9;min-height:44px}
  .bar input[type=range]{accent-color:#b5402f;height:44px}
  #seek{width:min(30vw,200px)}
  .knobw{display:flex;align-items:center;gap:.35em;padding:0 .3em;min-height:44px}
  #knob{--a:27deg;width:40px;height:40px;border-radius:50%;cursor:grab;touch-action:none;position:relative;outline:none;
    background:radial-gradient(circle at 38% 32%,#fffaf0 0,#e9e0cf 55%,#cfc4b0 100%);box-shadow:inset 0 0 0 2px #2a2622,0 2px 6px rgba(0,0,0,.25)}
  #knob:after{content:'';position:absolute;left:50%;top:5px;width:4px;height:13px;margin-left:-2px;border-radius:2px;background:#d2541e;transform-origin:2px 15px;transform:rotate(var(--a))}
  #knob:focus-visible{box-shadow:inset 0 0 0 2px #2a2622,0 0 0 3px rgba(210,84,30,.5)}
  #knobV{min-width:2.6em;font-variant-numeric:tabular-nums;font-size:13px}
  .bar button:disabled{opacity:.35;cursor:default}
  .tnow{font-variant-numeric:tabular-nums;min-width:9em;text-align:center;font-size:13px;opacity:.85}
  .start{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .6s}
  .start span{padding:.7em 1.6em;border-radius:999px;background:rgba(250,248,243,.86);font-size:17px;letter-spacing:.16em;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:breathe 2.4s ease-in-out infinite;margin-top:30%}
  @keyframes breathe{50%{opacity:.6}}
  .start.off{opacity:0}
  .tip{position:fixed;right:12px;top:10px;color:#e4ddd0;font-size:12px;opacity:.8;line-height:1.7;text-align:right;z-index:5;transition:opacity .4s;max-width:44vw}
  .tip.hide{opacity:0}
  #fallback{display:none;position:fixed;inset:0;padding:10vh 10vw;background:#f6f1e6;overflow:auto;line-height:1.9;z-index:9}
  #fallback h1{font-size:34px;margin:8px 0 16px}
  .bar{width:max-content}
  .bar .clk{font-variant-numeric:tabular-nums;min-width:6.4em;text-align:center;font-size:13px;opacity:.85;white-space:nowrap;letter-spacing:.04em;padding:0 .2em}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
</div>
<div class="bar" id="bar">
  <div class="title"><i>古希腊</i>安提基特拉机械 · 爱琴海</div>
  <button id="bHome" title="回到全景主机位">↺</button>
  <button id="bCam" title="切换机位（只在点的时候移动镜头）">视角：全景</button>
  <button id="bRun" title="运转 / 停（空格）">▶ 运转</button>
  <span class="clk" id="runClk" style="display:none">第 0 年 · 0 月</span>
  <button id="bNight" title="日 / 夜">◐</button>
  <button id="bHide" title="隐藏界面（H）">H</button>
</div>
<div class="tip" id="tip">拖动 = 旋转　滚轮 / 双指 = 缩放　右键 / 双指拖 = 平移<br>按 ↺ 回到固定全景机位 · ▶ 运转 / 空格 = 开 / 停 · H 隐藏界面<br>代码接口：window.STORY</div>
<div id="fallback">
  <h1>安提基特拉机械</h1>
  <p>你的浏览器没能启动 3D 图形（WebGL）。请用新版 Chrome、Edge、Safari 打开。</p>
</div>
